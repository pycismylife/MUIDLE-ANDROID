name: Build MU IDLE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract MU IDLE project
        run: |
          ZIP_FILE="./MU-IDLE-Android-WebView-iPhone-Build.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Không tìm thấy file ZIP mới"
            exit 1
          fi

          mkdir extracted
          unzip "$ZIP_FILE" -d extracted

          PROJECT_FILE=$(find extracted -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Không tìm thấy project Android"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Apply MU IDLE diagnostic and graphics panel
        run: |
          MAIN_ACTIVITY=$(find "$PROJECT_DIR/app/src/main/java" -name MainActivity.kt -print -quit)
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "Không tìm thấy MainActivity.kt trong project"
            exit 1
          fi
          cp patch/MainActivity.kt "$MAIN_ACTIVITY"
          echo "Đã áp dụng bảng điều khiển vào: $MAIN_ACTIVITY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build MU IDLE APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/MU-IDLE-Manager.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MU-IDLE-Manager-APK
          path: MU-IDLE-Manager.apk
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: MU IDLE – APK mới nhất
          body: "Bản APK mới nhất được build tự động từ nhánh main."
          files: MU-IDLE-Manager.apk
          overwrite_files: true
          make_latest: true
