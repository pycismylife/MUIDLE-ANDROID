name: Build MU IDLE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rebuild/auto-move-map-auto-filter-clean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract MU IDLE project
        run: |
          ZIP_FILE="./MU-IDLE-Android-WebView-iPhone-Build.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Không tìm thấy file ZIP mới"
            exit 1
          fi

          mkdir extracted
          unzip "$ZIP_FILE" -d extracted

          PROJECT_FILE=$(find extracted -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Không tìm thấy project Android"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Apply MU IDLE custom panels
        run: |
          MAIN_ACTIVITY=$(find "$PROJECT_DIR/app/src/main/java" -name MainActivity.kt -print -quit)
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "Không tìm thấy MainActivity.kt trong project"
            exit 1
          fi
          cp patch/MainActivity.kt "$MAIN_ACTIVITY"
          echo "Đã áp dụng bảng điều khiển vào: $MAIN_ACTIVITY"

      - name: Validate injected JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          source = Path("patch/MainActivity.kt").read_text(encoding="utf-8")
          for method in ("installAutoMoveMap", "installAutoFilter"):
              start = source.index("private fun " + method + "()")
              js_start = source.index('val js = """', start) + len('val js = """')
              js_end = source.index('""".trimIndent()', js_start)
              target = Path("/tmp/" + method + ".js")
              target.write_text(source[js_start:js_end], encoding="utf-8")
              subprocess.run(["node", "--check", str(target)], check=True)
          print("Both injected JavaScript modules passed node --check.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build MU IDLE APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon
          APK_NAME="MU-IDLE-Manager-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MU-IDLE-Manager-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.APK_NAME }}
          retention-days: 14

      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: MU IDLE – APK mới nhất
          body: "Bản APK mới nhất được build tự động từ nhánh main."
          files: ${{ env.APK_NAME }}
          make_latest: true
