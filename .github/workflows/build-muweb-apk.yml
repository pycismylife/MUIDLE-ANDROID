name: Build MU Web APK
on:
  workflow_dispatch:
  push:
    branches: [mu-web]
    paths: ['muweb/**', '.github/workflows/build-muweb-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build MU Web APK
        run: |
          cd muweb
          gradle --no-daemon assembleDebug
          APK_NAME="MU-Web-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: MU-Web-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.APK_NAME }}
          retention-days: 14
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mu-web-latest
          name: MU Web – APK mới nhất
          body: "APK MU Web được build tự động từ nhánh mu-web."
          files: ${{ env.APK_NAME }}
          make_latest: false
